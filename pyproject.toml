[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberwall_id_printer"
version = "0.1.1"
description = "Segmented Cyrillic ID labels and Bluetooth thermal printing via external TiMini Print"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
# BLE uses Bleak and its platform dependencies. Upstream winsdk is for Classic
# Bluetooth only; requiring it here forces an unnecessary source build on 3.14.
printer = [
  "bleak>=0.22,<3", "crc8>=0.2.0,<1", "pyserial>=3.5,<4",
  "platformdirs>=4,<5", "packaging>=21", "pypdfium2>=4,<6",
  "pyobjc-framework-IOBluetooth>=10; sys_platform == 'darwin'",
]

[project.scripts]
cyberwall-id-printer = "cyberwall_id_printer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyberwall_id_printer = ["py.typed"]

name: Windows standalone manager

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-manager.yml'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      manager_ref:
        description: 'Commit or branch of CyberpunkMasterManager'
        default: 'master'
        required: true

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: CyberpunkIdPrinter
      - uses: actions/checkout@v4
        with:
          repository: limbura/CyberpunkMasterManager
          ref: ${{ inputs.manager_ref || 'master' }}
          path: CyberpunkMasterManager
      - uses: actions/checkout@v4
        with:
          repository: limbura/CyberpunkPcRfidReader
          ref: d51466c2ac952eac8307366b3059fa0e7bb12282
          path: CyberpunkPcRfidReader
      - uses: actions/checkout@v4
        with:
          repository: Dejniel/TiMini-Print
          ref: 679fc0650e61c7ab28b44542b9b9ba000e45aa78
          path: TiMini-Print
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: './CyberpunkIdPrinter[printer]' -r CyberpunkMasterManager/cyberwall_master_manager/requirements.txt
      - name: Test printer library and real protocol encoder
        env:
          CYBERWALL_TIMINI_PATH: ${{ github.workspace }}/TiMini-Print
        run: python -m unittest discover -s CyberpunkIdPrinter/tests -v
      - name: Test manager
        run: python -m unittest discover -s CyberpunkMasterManager/cyberwall_master_manager/tests -v
      - name: Build and self-test full offline ZIP
        working-directory: CyberpunkMasterManager/cyberwall_master_manager
        run: python build_release.py --printer ../../CyberpunkIdPrinter --timini ../../TiMini-Print
      - name: Upload standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cyberwall-master-manager-windows-x64
          path: CyberpunkMasterManager/builds/*_windows_x64.zip
          if-no-files-found: error
          retention-days: 30

name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      CYBERWALL_TIMINI_PATH: ${{ github.workspace }}/TiMini-Print
    steps:
      - uses: actions/checkout@v4
        with:
          path: CyberpunkIdPrinter
      - uses: actions/checkout@v4
        with:
          repository: Dejniel/TiMini-Print
          ref: 679fc0650e61c7ab28b44542b9b9ba000e45aa78
          path: TiMini-Print
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Reproduce the user installation; dependencies must have wheels so a
      # runner's preinstalled compiler cannot hide accidental source builds.
      - run: python -m pip install --only-binary=:all: -e './CyberpunkIdPrinter[printer]'
      - run: python -m pip check
      - run: python -m cyberwall_id_printer check-backend
      - run: python -m unittest discover -s CyberpunkIdPrinter/tests -v

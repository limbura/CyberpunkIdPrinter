name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: CyberpunkIdPrinter
      - uses: actions/checkout@v4
        with:
          repository: Dejniel/TiMini-Print
          ref: 679fc0650e61c7ab28b44542b9b9ba000e45aa78
          path: TiMini-Print
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './CyberpunkIdPrinter[printer]'
      - run: python -m unittest discover -s CyberpunkIdPrinter/tests -v
        env:
          CYBERWALL_TIMINI_PATH: ${{ github.workspace }}/TiMini-Print

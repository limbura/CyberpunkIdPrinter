name: Publish printer library release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: printer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.13'
    env:
      CYBERWALL_TIMINI_PATH: ${{ github.workspace }}/TiMini-Print
    steps:
      - uses: actions/checkout@v4
        with:
          path: CyberpunkIdPrinter
      - uses: actions/checkout@v4
        with:
          repository: Dejniel/TiMini-Print
          ref: 679fc0650e61c7ab28b44542b9b9ba000e45aa78
          path: TiMini-Print
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install printer dependencies
        run: |
          python -m pip install --only-binary=:all: './CyberpunkIdPrinter[printer]'
      - name: Check installed dependencies and backend
        run: |
          python -m pip check
          python -m cyberwall_id_printer check-backend
      - name: Check Python syntax
        run: python -m compileall -q CyberpunkIdPrinter/src CyberpunkIdPrinter/scripts
      - name: Test printer and release packaging
        run: python -m unittest discover -s CyberpunkIdPrinter/tests -p 'test_*.py' -v

  publish:
    name: Verify version, build source ZIP and publish GitHub Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tagged commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate tag and package library
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/build_release.py --tag "$RELEASE_TAG" --output-dir dist
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/cyberwall_id_printer_$RELEASE_TAG.zip" \
            "dist/cyberwall_id_printer_$RELEASE_TAG.sha256" \
            --verify-tag \
            --title "cyberwall_id_printer $RELEASE_TAG" \
            --generate-notes
